name: ci
# Prose-only PRs (session archives, roadmap sweeps, working notes) skip the
# whole suite — nothing below is read by code or tests. CHANGELOG.md is
# deliberately NOT ignored: it ships inside the app binary via include_str!,
# and release PRs bump Cargo.toml anyway. AGENTS.md is ignored on the same
# evidence as the CLAUDE.md that imports it: no include_str! reads it, and no
# test reads the repo's OWN copy — every AGENTS.md in test/ and app/scripts/
# is a fixture written into a scratch repo, or a comment citing this file. paths-ignore skips only when EVERY
# changed file matches, so a mixed docs+code PR still runs full CI. main has
# no required status checks, so a skipped run shows zero checks and merges
# cleanly. Keep both lists identical (GitHub Actions YAML has no anchors we
# rely on).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'MIGRATION.md'
      - 'README.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'MIGRATION.md'
      - 'README.md'
      - '.claude/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: shellcheck + bash-3.2 gates
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          make lint
      - name: bash 3.2 parse gate (real 3.2 via docker) — the shim
        run: docker run --rm -v "$PWD:/s" bash:3.2 bash -n /s/bin/worktrees

  # Rust unit tests + build (fast, no tmux).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: build + test core/cli (GitHub runners ship Rust stable)
        run: |
          cargo build -p worktrees-core -p worktrees-cli --locked
          cargo test -p worktrees-core --locked
          # The CLI crate has unit tests too (the MCP server's protocol shaping).
          # Without this line they compile only when someone runs cargo test by
          # hand — a broken test module shipped once because of exactly that.
          cargo test -p worktrees-cli --locked

  # Default gate: the bats suite against the Rust binary (the shipped engine).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - name: install tmux (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: unit + real-tmux vs the Rust binary
        run: |
          make test
          make test-real-tmux

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: make install (build release + symlink binary) + smoke
        run: |
          make install BINDIR="$RUNNER_TEMP/xbin"
          "$RUNNER_TEMP/xbin/worktrees" --version
          "$RUNNER_TEMP/xbin/worktrees" help >/dev/null
      # Rides this job because the release build it needs is already done above.
      # Covers what bats and the unit tests cannot: the MCP server's watcher
      # thread writing to the same newline-delimited stdout as its request loop.
      - name: make test-mcp (MCP resource surface over a real pipe)
        run: make test-mcp

  # Tauri app crate ("P4"): frontend typecheck + build (dist feeds tauri-build),
  # then the Rust shell linking worktrees-core. rust-cache because the tauri dep
  # tree is the one genuinely slow compile in the workspace.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: webkit + gtk deps (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: frontend — install, typecheck (tsc), build
        run: |
          pnpm -C app install --frozen-lockfile
          pnpm -C app build
      - name: cargo build -p app
        run: cargo build -p app --locked
      # `build`/`check` do NOT compile `mod tests`, so without these lines the
      # app and api crates' unit tests only ever run when someone types the
      # command — the same gap that shipped a broken test module for the CLI
      # crate above. The api line matters most on ubuntu: the Linux half of
      # `proc_cwd` (/proc/<pid>/cwd) is dead code on a mac, and this is the only
      # place it is ever executed. It lived in the app crate until the command
      # layer moved to `worktrees-api`, and for a while after that move it ran
      # nowhere in CI, under a comment here saying the opposite.
      - name: cargo test -p app
        run: cargo test -p app --lib --locked
      # No `--lib`: `tests/headless.rs` is the one place the crate is driven
      # the way `worktrees serve` will drive it, through public API only.
      - name: cargo test -p worktrees-api
        run: cargo test -p worktrees-api --locked
      # The `app/scripts/*-check.mjs` family — source-slicing guards for rules
      # tsc and the unit tests cannot see. Last, because they are the cheapest
      # and a compile failure above is the more useful report.
      - name: frontend check scripts
        run: make test-frontend
