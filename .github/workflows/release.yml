name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Cross-compile the worktrees binary for the common desktop/server targets.
  # Pure-Rust (git/tmux are shelled out at runtime), so cross-compilation only
  # needs the target + (for aarch64-linux) a cross linker.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  target: aarch64-apple-darwin }
          - { os: macos-latest,  target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: version gate — tag matches Cargo.toml workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"$" Cargo.toml \
            || { echo "tag v$tag != workspace version in Cargo.toml"; exit 1; }
      - name: aarch64-linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release -p worktrees-cli --target "${{ matrix.target }}" --locked
      - name: package + checksum
        run: |
          mkdir -p dist
          asset="worktrees-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/worktrees" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: worktrees-${{ matrix.target }}
          path: dist/*

  # macOS desktop-app bundles. Unsigned — install.sh strips the quarantine attr
  # on an explicit, checksum-verified install; local `make install-app` needs
  # neither. Signing/notarization is the later distribution tier (task plan).
  app-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: version gate — tag matches Cargo.toml workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"$" Cargo.toml \
            || { echo "tag v$tag != workspace version in Cargo.toml"; exit 1; }
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # ── the documentation viewer ──────────────────────────────────────────
      #
      # A helper binary that ships INSIDE the bundle (tauri.conf.json bundles
      # `viewer/*` into Contents/Resources/) and is spawned on demand by
      # `open_docs_viewer`. It is built from source here rather than downloaded,
      # because the published release does not validate the `Host` header —
      # proposal §13.2: a loopback bind keeps other machines out and does NOT
      # keep out the browser on this one, which runs code from strangers and can
      # reach 127.0.0.1. §5.1's one-process-for-the-whole-app makes that blast
      # radius every document in every place at once.
      #
      # WHERE THE SOURCE COMES FROM is a repository variable, not a file in this
      # repo, and that is deliberate: the fix has been reported upstream through
      # GitHub Private Vulnerability Reporting and committing a patch here would
      # publish a working description of an unfixed issue in someone else's tool
      # (§14). Set `vars.VIEWER_MO_REPO` / `vars.VIEWER_MO_REF` to a build that
      # carries the check; when upstream ships one, point them at that tag and
      # delete nothing else. The default is upstream's own repo, which means the
      # GATE BELOW FAILS THE RELEASE until one of those two things is true —
      # which is the intended behaviour, not an oversight. A viewer that cannot
      # prove it refuses a foreign Host must not reach a user's machine, and a
      # release that quietly shipped one would be indistinguishable from a
      # release that did not.
      - uses: actions/setup-go@v6
        with: { go-version: "1.25", cache: false }
      - name: build, sign and GATE the documentation viewer
        env:
          VIEWER_REPO: ${{ vars.VIEWER_MO_REPO || 'https://github.com/k1LoW/mo' }}
          VIEWER_REF: ${{ vars.VIEWER_MO_REF || 'v1.6.8' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VIEWER_REF" "$VIEWER_REPO" /tmp/mo
          cd /tmp/mo

          # The viewer EMBEDS its own SPA (`//go:embed all:dist`), and that
          # directory is generated, not committed — a bare `go build` fails with
          # "pattern all:dist: no matching files found", which reads like a
          # broken checkout rather than a missing step. Its `go:generate` line is
          # a pnpm build, and this job already has pnpm and Node for the app's
          # own frontend. Once generated, the same `dist` serves both builds
          # below; it is architecture-independent.
          go generate ./internal/static/

          # The gate runs against a NATIVE build, because the runner cannot
          # execute the cross-compiled one. Same ref, same source, so what it
          # proves is that this SOURCE enforces the check; the arch assertion
          # below is what proves the shipped artefact is the right machine code.
          go build -trimpath -o /tmp/mo-gate .
          export XDG_STATE_HOME=/tmp/mo-gate-state
          /tmp/mo-gate --foreground --no-open --bind 127.0.0.1 --port 6399 &
          gate_pid=$!
          # `if`, not `nc … && break`: under `set -e` a bare AND-list that fails
          # is the loop body's last command, so the FIRST unsuccessful poll would
          # exit the step — a viewer that took 0.2s to start would read as a
          # viewer that never started.
          for _ in $(seq 1 100); do
            if nc -z 127.0.0.1 6399; then break; fi
            sleep 0.1
          done
          nc -z 127.0.0.1 6399 || { echo "::error::the viewer never listened"; kill $gate_pid; exit 1; }

          # `|| echo 000`: curl exits non-zero only when it could not speak HTTP
          # at all, and under `set -e` that would kill the step with no message
          # instead of failing the gate with one. 000 is not 403, so it fails —
          # loudly, which is the point.
          probe() { curl -s -o /dev/null -w '%{http_code}' "$@" || echo 000; }
          foreign=$(probe -H 'Host: worktrees-viewer-probe.invalid' http://127.0.0.1:6399/_/api/groups)
          loopback=$(probe http://127.0.0.1:6399/_/api/groups)
          kill $gate_pid || true

          # BOTH directions. A build that answered 403 to everything would pass a
          # one-sided check while being a viewer that serves nothing — the same
          # class of "the test passes and the feature is broken" this repo keeps
          # finding.
          if [ "$foreign" != "403" ]; then
            echo "::error::the viewer answered $foreign to a foreign Host header and must answer 403."
            echo "::error::See docs/proposals/place-docs.md §13.2. Point vars.VIEWER_MO_REPO/REF at a build that carries the check."
            exit 1
          fi
          if [ "$loopback" = "403" ]; then
            echo "::error::the viewer refuses a LOOPBACK Host too — it would serve nothing at all."
            exit 1
          fi
          echo "viewer gate: foreign Host -> $foreign, loopback Host -> $loopback"

          # The artefact that actually ships.
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) goarch=arm64 ;;
            x86_64-apple-darwin)  goarch=amd64 ;;
            *) echo "::error::no viewer GOARCH for ${{ matrix.target }}"; exit 1 ;;
          esac
          out="$GITHUB_WORKSPACE/app/src-tauri/viewer/mo"
          mkdir -p "$(dirname "$out")"
          GOOS=darwin GOARCH="$goarch" go build -trimpath -o "$out" .

          # A nested Mach-O inside a bundle Gatekeeper is assessing must carry a
          # signature of its own, or it is killed on first launch from a
          # DOWNLOADED release — which local builds never see, because they are
          # not quarantined. Ad-hoc when there is no identity, matching what the
          # rest of this pipeline produces (CLAUDE.md: releases stay ad-hoc).
          codesign --force --timestamp=none --sign "${APPLE_SIGNING_IDENTITY:--}" "$out"
          codesign --verify --verbose=2 "$out"

          # An arm64 binary in an x86_64 bundle is a silent exec failure: the app
          # starts, the Docs tab works, and only the browser button is dead.
          got=$(lipo -archs "$out")
          [ "$got" = "$goarch" ] || { echo "::error::viewer is '$got', expected '$goarch' for ${{ matrix.target }}"; exit 1; }
          echo "viewer: $goarch, $(du -h "$out" | cut -f1), signed"

      - name: build the app bundle (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          rustup target add "${{ matrix.target }}"
          pnpm -C app install --frozen-lockfile
          pnpm -C app tauri build --target "${{ matrix.target }}"
      # Rule 10's other half: assert the viewer is IN the thing that ships, not
      # merely in the directory the bundler was pointed at. A glob that silently
      # matched nothing, a resources key lost in a merge, or a bundler that put
      # it somewhere else all look identical from outside — and all of them
      # produce a release whose Docs button fails on every machine but ours.
      - name: assert the viewer is inside the bundle
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/worktrees.app"
          v="$app/Contents/Resources/viewer/mo"
          [ -f "$v" ] || { echo "::error::no viewer at Contents/Resources/viewer/mo"; ls -R "$app/Contents/Resources" || true; exit 1; }
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) want=arm64 ;;
            x86_64-apple-darwin)  want=amd64 ;;
            # `set -u` would otherwise report an unbound `want` on a target
            # added to the matrix and not here — which reads as a shell bug
            # rather than as the missing case it is.
            *) echo "::error::no viewer arch known for ${{ matrix.target }}"; exit 1 ;;
          esac
          got=$(lipo -archs "$v")
          [ "$got" = "$want" ] || { echo "::error::bundled viewer is '$got', expected '$want'"; exit 1; }
          codesign --verify --verbose=2 "$v"
          echo "bundled viewer: $want, $(du -h "$v" | cut -f1)"

      - name: package + checksum
        run: |
          mkdir -p dist
          asset="worktrees-app-${{ matrix.target }}.app.tar.gz"
          bundle="target/${{ matrix.target }}/release/bundle/macos"
          # createUpdaterArtifacts already produced the tar.gz + minisign .sig —
          # one artifact serves both install.sh and the in-app updater
          cp "$bundle/worktrees.app.tar.gz" "dist/$asset"
          cp "$bundle/worktrees.app.tar.gz.sig" "dist/$asset.sig"
          cd dist
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: worktrees-app-${{ matrix.target }}
          path: dist/*

  release:
    needs: [build, app-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: art }
      - name: assemble binaries + combined checksums
        run: |
          mkdir -p dist
          find art -type f -name 'worktrees-*' ! -name '*.sha256' -exec cp {} dist/ \;
          cat art/*/*.sha256 > dist/checksums.txt
          echo "── checksums ──"; cat dist/checksums.txt
      - name: updater manifest (latest.json — the in-app updater's endpoint)
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          arm="worktrees-app-aarch64-apple-darwin.app.tar.gz"
          x64="worktrees-app-x86_64-apple-darwin.app.tar.gz"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg armurl "$base/$arm" --arg armsig "$(cat "art/worktrees-app-aarch64-apple-darwin/$arm.sig")" \
            --arg x64url "$base/$x64" --arg x64sig "$(cat "art/worktrees-app-x86_64-apple-darwin/$x64.sig")" \
            '{version: $version, pub_date: (now | todate), platforms: {
               "darwin-aarch64": {url: $armurl, signature: $armsig},
               "darwin-x86_64": {url: $x64url, signature: $x64sig}}}' > dist/latest.json
          cat dist/latest.json
      - name: changelog notes for this tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md || true
          [ -s dist/notes.md ] || echo "worktrees $GITHUB_REF_NAME" > dist/notes.md
          cat dist/notes.md
      - name: create GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/worktrees-* dist/checksums.txt dist/latest.json \
            --title "worktrees $GITHUB_REF_NAME" --notes-file dist/notes.md
