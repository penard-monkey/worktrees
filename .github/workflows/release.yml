name: release bundles
# Everything a release ships, built, checked, signed and assembled into one
# `release-dist` artifact — and NOTHING that publishes. Two callers, one set of
# steps:
#   publish.yml          — a `v*` tag: `dry_run: false`, the real updater key,
#                          then its own job uploads release-dist as the release.
#   release-dry-run.yml  — a pull request touching the packaging: `dry_run:
#                          true`, no secrets at all, a throwaway key made here.
# So the steps a release runs are the steps every packaging PR already ran, and
# the first Linux release is not the first time its Linux jobs execute.
#
# Why the publishing step lives in publish.yml and not behind an `if:` here: a
# called workflow can never hold more than its caller grants, so keeping
# `contents: write` out of this file means the pull-request path never asks for
# a write token at all; and a tag push carries no `inputs`, so a guard such as
# `if: inputs.publish` reads EMPTY on the real release — and Actions' loose
# equality makes empty == false — which would skip the publish silently. Here
# `dry_run` is required, so every caller says which it is.
# `app/scripts/release-dryrun-check.mjs` pins all of it.
on:
  workflow_call:
    inputs:
      dry_run:
        description: true = build and check everything, sign with a throwaway key, publish nothing
        type: boolean
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: the updater signing key; publish.yml passes it, a dry run must not
        required: false

permissions:
  contents: read

jobs:
  # The run's one decision: which tag, and which targets. A release builds every
  # row; a dry run builds the rows marked `dry` — both Linux arches and the
  # native Mac app — and takes its tag from Cargo.toml, so the version gates and
  # the sidecar's `--version` check still compare real values.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      cli_matrix: ${{ steps.plan.outputs.cli_matrix }}
      app_matrix: ${{ steps.plan.outputs.app_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # The CLI is pure Rust (git/tmux are shelled out at runtime), so it
          # cross-compiles: both Linux arches on ubuntu-latest, aarch64 with a
          # cross linker. The app is a WebKitGTK app on Linux and is never
          # cross-built, so each Linux arch gets a runner of its own arch
          # (ubuntu-24.04-arm is GitHub-hosted, free for public repositories).
          cli='[
            {"os": "macos-latest",  "target": "aarch64-apple-darwin",      "dry": false},
            {"os": "macos-latest",  "target": "x86_64-apple-darwin",       "dry": false},
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu",  "dry": true},
            {"os": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu", "dry": true}]'
          app='[
            {"os": "macos-latest",     "target": "aarch64-apple-darwin",      "dry": true},
            {"os": "macos-latest",     "target": "x86_64-apple-darwin",       "dry": false},
            {"os": "ubuntu-latest",    "target": "x86_64-unknown-linux-gnu",  "dry": true},
            {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "dry": true}]'
          if [ "$DRY_RUN" = true ]; then
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            pick='[.[] | select(.dry) | del(.dry)]'
          else
            # Only a version tag publishes, whatever the caller said.
            case "$GITHUB_REF" in
              refs/tags/v*) ;;
              *) echo "::error::a publishing run needs a v* tag, not $GITHUB_REF"; exit 1 ;;
            esac
            tag="$GITHUB_REF_NAME"
            pick='map(del(.dry))'
          fi
          case "$tag" in v[0-9]*) ;; *) echo "::error::no version for the tag: '$tag'"; exit 1 ;; esac
          # Assigned first: inside `echo "x=$(jq …)"` a failing jq leaves an
          # empty matrix and a step that still exits 0 (measured, on an image
          # with no jq).
          cli_rows="$(jq -c "$pick" <<<"$cli")"
          app_rows="$(jq -c "$pick" <<<"$app")"
          {
            echo "tag=$tag"
            echo "cli_matrix=$cli_rows"
            echo "app_matrix=$app_rows"
          } | tee -a "$GITHUB_OUTPUT"
      # Once per release, here because every other job needs `plan`: no build
      # starts while the lockfile carries a RustSec advisory deny.toml does not
      # name. A pull request only SEES its advisories (deny.yml); a release
      # cannot ship past one. The dry run of a packaging PR stops here too,
      # which is the point of rehearsing the release's own steps.
      - uses: ./.github/actions/cargo-deny
      - name: GATE — no untriaged RustSec advisory in the lockfile
        run: cargo deny --locked check advisories

  # Cross-compile the worktrees binary for the common desktop/server targets.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cli_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: version gate — tag matches Cargo.toml and install.sh
        run: |
          tag="${TAG#v}"
          grep -q "^version = \"$tag\"$" Cargo.toml \
            || { echo "tag v$tag != workspace version in Cargo.toml"; exit 1; }
          grep -q "^SCRIPT_VERSION=\"v$tag\"$" install.sh \
            || { echo "tag v$tag != install.sh SCRIPT_VERSION"; exit 1; }
      - name: aarch64-linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release -p worktrees-cli --target "${{ matrix.target }}" --locked
      - name: package + checksum
        run: |
          mkdir -p dist
          asset="worktrees-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/worktrees" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
      # A dry run's artifacts are only for looking at: a day, then gone.
      # 0 means the repository's default.
      - uses: actions/upload-artifact@v7
        with:
          name: worktrees-${{ matrix.target }}
          path: dist/*
          retention-days: ${{ inputs.dry_run && 1 || 0 }}

  # Desktop-app bundles: macOS (.app → updater .tar.gz) and Linux (AppImage +
  # .deb), each on a runner of its own arch except the x86_64 Mac, which is
  # cross-built on arm64 and never executed. Linux is never cross-built: a
  # WebKitGTK app links the distro's GTK stack, so each Linux arch is built on
  # its own runner (ubuntu-24.04-arm is a GitHub-hosted runner, free for public
  # repositories). macOS bundles are ad-hoc signed as complete apps: a linker-
  # signed executable alone leaves CodeResources absent and fails strict bundle
  # verification. install.sh still strips quarantine on an explicit,
  # checksum-verified install; Developer ID + notarization is the later tier.
  # Each bundle carries the CLI for its own arch as a private sidecar — macOS
  # Contents/MacOS/worktrees, Linux usr/lib/worktrees/worktrees — the app's to
  # use, never put on PATH by us. tmux and git are not bundled anywhere: the
  # .deb Depends on the distro's, and the AppImage, like the .app, uses the
  # system's.
  app-bundle:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.app_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: version gate — tag matches Cargo.toml workspace version
        run: |
          tag="${TAG#v}"
          grep -q "^version = \"$tag\"$" Cargo.toml \
            || { echo "tag v$tag != workspace version in Cargo.toml"; exit 1; }
      # CI's `app` job installs the first line; the rest is bundling: patchelf
      # and xdg-utils for the AppImage (tauri copies xdg-open into it, and
      # aborts without one — measured on a bare ubuntu:24.04), squashfs-tools
      # and binutils so sidecar.sh can look inside an AppImage without running it.
      - name: webkit + gtk + bundling deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils squashfs-tools binutils file
      - uses: pnpm/action-setup@v6
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # ── the documentation viewer ──────────────────────────────────────────
      #
      # The browser page. It ships INSIDE the bundle (tauri.conf.json bundles
      # `viewer/*` as resources: Contents/Resources/ on macOS,
      # usr/lib/worktrees/ in the AppImage and .deb) and is served by the app's own
      # loopback server at `GET /<token>/viewer.js`. Nothing executes it: it is
      # a file the user's browser fetches.
      #
      # There used to be a Go toolchain here, a `git clone` of a third-party
      # viewer, and a gate against it, because the viewer was `mo` and `mo`
      # does not validate the `Host` header (proposal §13.2). The server is
      # ours now — `crates/worktrees-api/src/docserver.rs` — so what is gated is our
      # own source, and the gate below runs it.
      - name: build the documentation viewer's browser bundle
        run: |
          set -euo pipefail
          pnpm -C app install --frozen-lockfile
          # A named error, because the raw one ("Command \"build:viewer\" not
          # found") reads as a broken checkout rather than as the branch that
          # owns the page not having landed. Read from package.json rather than
          # from `pnpm run`'s listing, which indents and would never match.
          grep -q '"build:viewer"' app/package.json \
            || { echo "::error::app/package.json has no build:viewer script"; exit 1; }
          pnpm -C app build:viewer
          out="$GITHUB_WORKSPACE/app/src-tauri/viewer/viewer.js"
          mkdir -p "$(dirname "$out")"
          cp app/viewer/dist/viewer.js "$out"
          # A bundle that built to nothing is a blank page with no error, on
          # every machine but the one that built it.
          bytes=$(wc -c < "$out")
          [ "$bytes" -gt 10000 ] \
            || { echo "::error::the viewer bundle is $bytes bytes, which is not a bundle"; exit 1; }
          echo "viewer bundle: $(du -h "$out" | cut -f1)"

      # ── THE GATE ──────────────────────────────────────────────────────────
      #
      # The release criterion §11.3 set, executed: prove the server refuses a
      # request that lies about who it is talking to, and prove it still serves
      # one that does not. BOTH directions, because a server that answered 403
      # to everything would pass a one-sided check while serving nothing at all
      # — the same class of "the test passes and the feature is broken" this
      # repo keeps finding.
      #
      # **Why this is not a `curl`.** The previous gate curled a third-party
      # binary, because a binary was the only thing we had; the server is now
      # our source, and the honest instrument is the test that starts it and
      # speaks HTTP to it over a real loopback socket. Raw sockets are also
      # strictly better than curl here: **curl silently collapses duplicate
      # `Host` headers** and sends only one, which made the first run of that
      # case in the transport findings a false pass (§6.1). `--exact` so a
      # rename cannot turn this step into a filter that matches nothing and
      # exits 0 — which is the shape a gate fails in. The CRATE matters as much
      # as the names: these tests moved to `worktrees-api` with the command
      # layer, and under `-p app` the same filter matches nothing. Only the
      # count check below notices either mistake.
      - name: GATE — the docs server refuses a forged Host and serves a loopback one
        run: |
          set -euo pipefail
          cargo test -p worktrees-api --lib --locked -- --exact --nocapture \
            docserver::tests::a_forged_host_is_refused_and_a_loopback_one_is_served \
            docserver::tests::a_duplicate_host_header_is_refused_rather_than_resolved \
            docserver::tests::a_cross_origin_request_is_refused_and_nothing_says_otherwise \
            docserver::tests::a_missing_token_or_a_traversal_reaches_nothing \
            2>&1 | tee /tmp/gate.log
          # A pipeline's exit status is the LAST stage's, and `tee` always
          # succeeds — so the run reads green whatever cargo said unless the
          # count is checked too.
          grep -q '^test result: ok. 4 passed' /tmp/gate.log \
            || { echo "::error::the docs-server gate did not run all four cases"; exit 1; }

      # The same gate for `worktrees serve`, whose binary this job bundles as the
      # app's engine: reachable on loopback and from nowhere else (decision 6 of
      # docs/proposals/server-edition.md). The witness is a CONNECT, never a
      # bind, because no bind result means the same thing on macOS and Linux,
      # and the loopback connect comes FIRST so a dead server cannot pass the
      # refusal after it. The runner sets `CI`, so a runner with no LAN address
      # fails the test instead of skipping its LAN half. `--exact` and the count
      # for the reason given above: under the wrong crate or `--test` target, or
      # after a rename, the filter matches nothing and cargo exits 0.
      - name: GATE — serve answers on loopback and not off it
        run: |
          set -euo pipefail
          cargo test -p worktrees-cli --test serve_bin --locked -- --exact --nocapture \
            serve_can_be_reached_on_loopback_and_not_off_it \
            2>&1 | tee /tmp/serve-gate.log
          grep -q '^test result: ok. 1 passed' /tmp/serve-gate.log \
            || { echo "::error::the serve loopback gate did not run its one case"; exit 1; }

      # Remote access, by IDENTITY (Phase 2 §4.6): bound to the runner's own
      # LAN address, a device paired through the real pairing port is served
      # over pinned mutual TLS, and no certificate, an unenrolled key, the
      # wrong pin, loopback and a closed pairing port are each refused; a
      # revoke and the kill switch end a live device within a second. The
      # served cases come first, and a runner with no LAN address fails. Two
      # cases, by exact name, and the count, for the reason above.
      - name: GATE — remote access serves a paired key and nothing else
        run: |
          set -euo pipefail
          cargo test -p worktrees-cli --test remote_bin --locked -- --exact --nocapture \
            remote_access_serves_a_paired_key_and_refuses_every_other \
            the_kill_switch_and_a_revoke_end_a_live_device_at_once \
            2>&1 | tee /tmp/remote-gate.log
          grep -q '^test result: ok. 2 passed' /tmp/remote-gate.log \
            || { echo "::error::the remote access gate did not run its two cases"; exit 1; }

      # ── the CLI sidecar ───────────────────────────────────────────────────
      #
      # Built HERE, from this checkout, for this matrix target — not fetched
      # from the `build` job — so it is this commit by construction, and so the
      # path that makes it is the one `make install-app` runs on every local
      # install rather than one whose first exercise is a release.
      # tauri.conf.json's per-format `files` mappings carry it from
      # app/src-tauri/binaries/worktrees into every bundle; the bundler is the
      # only thing that reads them, and it FAILS with nothing staged ("Failed to
      # copy custom files"), so this step cannot be skipped by accident.
      - name: stage the CLI sidecar for this target
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          app/scripts/sidecar.sh stage "${{ matrix.target }}"

      # macOS keeps `targets: "all"`: the .app the updater tarball is made from,
      # plus the dmg. Linux asks for exactly what ships — the AppImage, which is
      # its own updater artifact, and the .deb — because `all` adds an .rpm
      # nothing tests. createUpdaterArtifacts signs both Linux files.
      #
      # The key: a release signs with the real one and refuses to run without
      # it — a throwaway fallback there would ship updates every installed app
      # rejects. A dry run is handed no secrets by its caller, refuses to run if
      # it somehow got the real one, and signs with a key made here and thrown
      # away with the runner, so createUpdaterArtifacts runs exactly as it ships.
      - name: build the app bundle (signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pnpm -C app install --frozen-lockfile
          if [ "$DRY_RUN" = true ]; then
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::a dry run was handed TAURI_SIGNING_PRIVATE_KEY; its caller must pass no secrets"; exit 1
            fi
            app/node_modules/.bin/tauri signer generate --ci -p "" -w "$RUNNER_TEMP/dry-run.key"
            TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/dry-run.key")"
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          elif [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::no TAURI_SIGNING_PRIVATE_KEY: a release is signed with the real updater key"; exit 1
          fi
          pnpm -C app tauri build --target "${{ matrix.target }}" \
            ${{ runner.os == 'Linux' && '--bundles deb,appimage' || '' }}

      # Same rule as the viewer below: assert the sidecar is IN what ships.
      # macOS: the .app directory is never uploaded — the updater tarball is,
      # and both install.sh and the in-app updater fetch it — so the check runs
      # twice: on the bundle (did the bundler take it, and seal the app?) and on
      # that tarball unpacked (did it survive tar, seal and executable bit
      # included?). Linux: the
      # AppImage and the .deb ARE what ships, and the check unpacks each without
      # running anything in it. The check is: a regular executable file, this
      # target's arch and only that (`lipo` / the ELF header), the same as the
      # GUI binary beside it, version == the tag — and on Linux, no worktrees in
      # usr/bin. `--version` runs only on a native one; the x86_64 Mac bundle is
      # cross-built on an arm64 runner and is never executed — its version is
      # read as data from the marker the CLI embeds. Never the GUI binary: on
      # macOS it launches instead of answering.
      - name: assert the CLI sidecar is inside the shipped bundle
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          v="${TAG#v}"
          b="target/$t/release/bundle"
          if [ "$RUNNER_OS" = macOS ]; then
            app/scripts/sidecar.sh check "$b/macos/worktrees.app" "$t" "$v"
            shipped="$RUNNER_TEMP/shipped-$t"
            rm -rf "$shipped" && mkdir -p "$shipped"
            tar -xzf "$b/macos/worktrees.app.tar.gz" -C "$shipped"
            app/scripts/sidecar.sh check "$shipped/worktrees.app" "$t" "$v"
          else
            for pkg in "$b"/appimage/*.AppImage "$b"/deb/*.deb; do
              app/scripts/sidecar.sh check "$pkg" "$t" "$v"
            done
          fi
      # Rule 10's other half: assert the bundle is IN the thing that ships, not
      # merely in the directory the bundler was pointed at. A glob that silently
      # matched nothing, a resources key lost in a merge, or a bundler that put
      # it somewhere else all look identical from outside — and all of them
      # produce a release whose Docs button opens a blank tab on every machine
      # but ours. On Linux the AppImage and .deb are unpacked, not their
      # staging directories.
      - name: assert the viewer bundle is inside the app bundle
        run: |
          set -euo pipefail
          b="target/${{ matrix.target }}/release/bundle"
          viewer() {   # $1 the viewer.js to check  $2 where, as reported
            if [ ! -f "$1" ]; then
              echo "::error::no viewer bundle at $2"; ls -R "$(dirname "$(dirname "$1")")" || true; exit 1
            fi
            bytes=$(wc -c < "$1")
            [ "$bytes" -gt 10000 ] || { echo "::error::the viewer at $2 is $bytes bytes"; exit 1; }
            echo "bundled viewer: $2 ($(du -h "$1" | cut -f1))"
          }
          if [ "$RUNNER_OS" = macOS ]; then
            viewer "$b/macos/worktrees.app/Contents/Resources/viewer/viewer.js" Contents/Resources/viewer/viewer.js
          else
            for pkg in "$b"/appimage/*.AppImage "$b"/deb/*.deb; do
              root="$RUNNER_TEMP/viewer-${pkg##*/}"
              rm -rf "$root"
              app/scripts/sidecar.sh unpack "$pkg" "$root"
              viewer "$root/usr/lib/worktrees/viewer/viewer.js" "usr/lib/worktrees/viewer/viewer.js in ${pkg##*/}"
            done
          fi
      # tmux and git are the SYSTEM's on every platform: a bundled tmux talking
      # to the user's own tmux server (or the reverse) is client/server version
      # skew, and the engine shells out to both on purpose. The .deb therefore
      # declares them, so apt installs the distro's, and the AppImage must not
      # have picked either up.
      - name: assert tmux and git come from the distro (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          b="target/${{ matrix.target }}/release/bundle"
          for deb in "$b"/deb/*.deb; do
            deps="$(dpkg-deb -f "$deb" Depends)"
            echo "${deb##*/} Depends: $deps"
            for d in tmux git; do
              case ", $deps," in
                *", $d,"*|*", $d ("*) ;;
                *) echo "::error::${deb##*/} does not depend on $d"; exit 1 ;;
              esac
            done
          done
          for img in "$b"/appimage/*.AppImage; do
            root="$RUNNER_TEMP/nobundled-${img##*/}"
            rm -rf "$root"
            app/scripts/sidecar.sh unpack "$img" "$root"
            found="$(find "$root" -type f \( -name tmux -o -name git \))"
            [ -z "$found" ] || { echo "::error::${img##*/} bundles: $found"; exit 1; }
            echo "${img##*/}: no tmux, no git inside"
          done

      - name: package + checksum
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          b="target/$t/release/bundle"
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            # createUpdaterArtifacts already produced the tar.gz + minisign
            # .sig — one artifact serves both install.sh and the in-app
            # updater. The .sig is over the whole tarball, so it covers the
            # sidecar with the rest of the bundle; nothing about signing
            # changes for it.
            asset="worktrees-app-$t.app.tar.gz"
            cp "$b/macos/worktrees.app.tar.gz" "dist/$asset"
            cp "$b/macos/worktrees.app.tar.gz.sig" "dist/$asset.sig"
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          else
            # No tarball on Linux: the AppImage is signed as it is, and so is
            # the .deb. Both are updater artifacts — an app installed from a
            # .deb updates with `pkexec dpkg -i`, an AppImage by rewriting
            # itself — and each .sig is over the whole file, sidecar included.
            for pkg in "$b"/appimage/*.AppImage "$b"/deb/*.deb; do
              asset="worktrees-app-$t.${pkg##*.}"
              cp "$pkg" "dist/$asset"
              cp "$pkg.sig" "dist/$asset.sig"
              (cd dist && sha256sum "$asset" > "$asset.sha256")
            done
          fi
          cat dist/*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: worktrees-app-${{ matrix.target }}
          path: dist/*
          retention-days: ${{ inputs.dry_run && 1 || 0 }}

  # Everything the release will carry, in one artifact: the binaries, the
  # bundles and their .sigs, checksums.txt, latest.json and the notes.
  # publish.yml uploads exactly this; a dry run stops here.
  assemble:
    needs: [plan, build, app-bundle]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: art }
      - name: assemble binaries + combined checksums
        run: |
          mkdir -p dist
          find art -type f -name 'worktrees-*' ! -name '*.sha256' -exec cp {} dist/ \;
          cat art/*/*.sha256 > dist/checksums.txt
          echo "── checksums ──"; cat dist/checksums.txt
      # The updater looks up `<os>-<arch>-<installer>` first and `<os>-<arch>`
      # second (tauri-plugin-updater 2.10 `get_urls`), so the plain Linux keys
      # are the AppImage and the `-deb` keys the .deb: an app installed from a
      # .deb must never be handed an AppImage, which its installer refuses
      # (InvalidUpdaterFormat). The entries come from the targets this run
      # BUILT (plan's app matrix), so a target added there cannot ship without
      # its update; and a publishing run must still come out with all six keys.
      # Every signature is read into a variable first, so a missing .sig fails
      # here instead of shipping an empty signature.
      - name: updater manifest (latest.json — the in-app updater's endpoint)
        env:
          APP_MATRIX: ${{ needs.plan.outputs.app_matrix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          entries=()
          for t in $(jq -r '.[].target' <<<"$APP_MATRIX"); do
            arch="${t%%-*}"
            case "$t" in
              *-apple-darwin)      entries+=("darwin-$arch $t app.tar.gz") ;;
              *-unknown-linux-gnu) entries+=("linux-$arch $t AppImage" "linux-$arch-deb $t deb") ;;
              *) echo "::error::no updater key for $t"; exit 1 ;;
            esac
          done
          platforms='{}'
          for e in "${entries[@]}"; do
            read -r key t ext <<<"$e"
            sig="$(cat "art/worktrees-app-$t/worktrees-app-$t.$ext.sig")"
            [ -n "$sig" ] || { echo "::error::empty signature: worktrees-app-$t.$ext.sig"; exit 1; }
            platforms="$(jq -c --arg k "$key" --arg url "$base/worktrees-app-$t.$ext" --arg sig "$sig" \
              '. + {($k): {url: $url, signature: $sig}}' <<<"$platforms")"
          done
          want="darwin-aarch64 darwin-x86_64 linux-aarch64 linux-aarch64-deb linux-x86_64 linux-x86_64-deb"
          have="$(jq -r 'keys | join(" ")' <<<"$platforms")"
          if [ "$DRY_RUN" != true ] && [ "$have" != "$want" ]; then
            echo "::error::latest.json would carry [$have]; a release needs [$want]"; exit 1
          fi
          jq -n --arg version "${TAG#v}" --argjson platforms "$platforms" \
            '{version: $version, pub_date: (now | todate), platforms: $platforms}' > dist/latest.json
          cat dist/latest.json
      - name: changelog notes for this tag
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md || true
          [ -s dist/notes.md ] || echo "worktrees $TAG" > dist/notes.md
          cat dist/notes.md
      - name: what the release would carry
        run: ls -la dist
      # publish.yml uploads exactly this, file for file. A dry run keeps it a
      # day, for looking at.
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          retention-days: ${{ inputs.dry_run && 1 || 0 }}
