name: release
# A `v*` tag (`make release` pushes one): build everything with release.yml —
# the same steps every packaging pull request runs as a dry run
# (release-dry-run.yml) — then create the GitHub release from what it
# assembled. This is the ONLY workflow that publishes, holds `contents: write`
# or passes the updater signing key; app/scripts/release-dryrun-check.mjs
# fails if any of that moves.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundles:
    uses: ./.github/workflows/release.yml
    with:
      dry_run: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  publish:
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release-dist, path: dist }
      - name: create GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/worktrees-* dist/checksums.txt dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "worktrees $GITHUB_REF_NAME" --notes-file dist/notes.md
