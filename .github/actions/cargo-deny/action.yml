# cargo-deny onto PATH, for deny.yml and for release.yml's advisory gate: ONE
# pinned version and checksum, so the two cannot drift apart.
#
# cargo-deny's own release binary, checksum-verified, run with the runner's
# stable cargo. Not the marketplace action: that one runs in a Rust 1.85 image
# it builds by piping an unverified download into tar. x86_64 Linux runners
# only, which is where both callers run.
name: install cargo-deny
description: cargo-deny's release binary, pinned and checksum-verified, onto PATH
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DENY_VERSION: "0.20.2"
        DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        set -euo pipefail
        t="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
        curl -fsSL -o "$RUNNER_TEMP/$t.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$t.tar.gz"
        echo "$DENY_SHA256  $RUNNER_TEMP/$t.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$t.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$t" >> "$GITHUB_PATH"
