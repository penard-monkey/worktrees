<!doctype html>
<!--
  The shell the server returns for `GET /<token>/p/<place>/`.

  It carries NO token, no place and no port. Every route is relative to the URL
  this document was served from, so the same bytes work for every place behind
  every token: `../../viewer.js` from `/<token>/p/<place>/` resolves to
  `/<token>/viewer.js`, and `doc`, `index` and `asset/<rel>` resolve beside it.
  THE SERVER MUST SERVE THIS AT A PATH ENDING IN `/` — without the trailing
  slash the browser resolves `../../` one segment too high. A redirect from
  `/<token>/p/<place>` to `/<token>/p/<place>/` is the whole fix.

  The script is a CLASSIC script, deliberately. docs-render §3 measured that
  `<script type="module">` is blocked outright on a `file://` page in both
  Chromium and WebKit (module scripts are fetched with CORS and a `file:`
  document's origin is `null`), and mermaid resolves its diagram types through
  `await import()` — 37 surviving call sites in a code-split build, every one a
  fetch that `default-src 'none'` would refuse. A single IIFE has none.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The token is IN THE URL, so a `Referer` on an outbound click would hand a
      stranger a capability to every document in this place. This is the page's
      own half of that; the server should also send `Referrer-Policy:
      no-referrer` as a header, and blocks.tsx opens external links with
      `noreferrer,noopener` as the third lock.
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      CSP. What each directive forbids:

        default-src 'none'   the backbone — every fetch not explicitly allowed
                             below is refused AND reported, which is what makes
                             "no outbound network" a measurement and not a hope
        script-src  'self'   only this server's own bundle. No 'unsafe-inline',
                             which is also a second lock on markdown.tsx's
                             safeHref: it blocks `javascript:` URLs outright
        style-src   'unsafe-inline'   REQUIRED, and DO NOT "tighten" it by
                             adding a hash beside it — per CSP2/3 a hash in a
                             directive VOIDS 'unsafe-inline' in that directive,
                             and mermaid injects 4 379 characters of its own
                             <style> plus 73 inline style= attributes into the
                             SVG it returns. Measured (docs-render §4): with a
                             hash added, 5 style-src-elem + 73 style-src-attr
                             violations and the diagram silently missing, while
                             the prose, tables, fences and images all rendered
                             perfectly. It looks exactly like a mermaid bug
        img-src 'self' data: assets come only from this server's own origin;
                             `data:` is for images a document inlines itself
        connect-src 'self'   the 1 Hz conditional GET, and nothing else. No
                             outbound fetch, XHR, WebSocket or beacon: a
                             document cannot phone home to report it was read
        font-src 'none'      no webfonts — the stylesheet contains no @font-face
                             and no url() at all
        form-action 'none'   nothing can be POSTed anywhere
        base-uri 'none'      no <base> element can rewrite every relative URL,
                             which is what the API base depends on
        object-src / frame-src / media-src / worker-src / manifest-src 'none'
                             the remaining fetching and embedding sinks

      Two directives are IGNORED in a <meta> per CSP3 and must come from the
      server as headers: `frame-ancestors` and `report-to`/`report-uri`. The
      server should send this policy as a header WITH `frame-ancestors 'none'`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'"
    />
    <!-- Replaced by the viewer with `<place> · <document>`, place FIRST: a tab
         strip truncates from the right, and the place is the discriminating
         half when two tabs hold the same document from different worktrees. -->
    <title>documents</title>
    <!-- Only so the first paint is not a white flash before the bundle injects
         the real sheet. Deliberately not a copy of any token. -->
    <style>
      html { background: #0f0f16; color-scheme: dark; }
      body { margin: 0; }
      .boot { padding: 24px; font: 14px ui-sans-serif, system-ui, sans-serif; color: #565f89; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">loading the documents viewer…</div></div>
    <noscript>
      <div class="boot">
        This viewer renders markdown and diagrams in the browser and needs
        JavaScript. The documents themselves are plain files in the worktree.
      </div>
    </noscript>
    <script src="../../viewer.js"></script>
  </body>
</html>
