[package]
name = "app"
version.workspace = true
description = "worktrees — one place per branch (desktop app)"
authors = ["David"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine, in-process (no subprocess, no WORKTREES_BIN). See MIGRATION.md Inc 4.
worktrees-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: round-trip unknown keys in the declared store in file order.
serde_json = { version = "1", features = ["preserve_order"] }
# PTY host: attach to a live tmux session (never own a shell). See DESIGN.md P1.
portable-pty = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# PID-liveness check for Claude session probes (kill(pid, 0)); already in the
# lock tree transitively. macOS + Linux.
libc = "0.2"
# A place's route segment and its derived tree are disambiguated by
# sha256(canonical root)[..8] — two projects may legitimately hold the same
# slug. Already in the lock tree (tauri's updater pulls it), so this adds a
# name here and nothing to the supply chain.
sha2 = "0.10"
# The documentation server (`docserver.rs`). Every one of these is ALREADY in
# Cargo.lock by way of tauri's own HTTP stack, so naming them here adds no
# supply chain — which is the whole reason the `docs-transport` findings'
# std-only recommendation was not taken (its own §8.2 argues hyper is the right
# call wherever hyper is already present, and it is). What we write is routing
# and policy; the `mo` bug this rewrite exists to remove was a missing policy
# check, not a parser bug, and a parser we wrote would be one more thing to be
# wrong about.
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time"] }
# 16 bytes for the per-launch path token. The OS's CSPRNG, not a clock and a
# pid: a token anyone can reconstruct is not a token.
getrandom = "0.3"


[target.'cfg(target_os = "macos")'.dependencies]
# One raw selector at startup: turn Writing Tools off for the webview, so
# macOS's selection affordance can't take the app down. See `run`'s setup.
objc2 = "0.6"
