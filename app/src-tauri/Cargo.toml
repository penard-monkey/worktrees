[package]
name = "app"
version.workspace = true
description = "worktrees — one place per branch (desktop app)"
authors = ["David"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine, in-process (no subprocess, no WORKTREES_BIN). See MIGRATION.md Inc 4.
worktrees-core = { workspace = true }
# The command layer. Handler bodies live here so `worktrees serve` can call the
# same commands without a window; this crate keeps the Tauri wrappers.
worktrees-api = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: round-trip unknown keys in the declared store in file order.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The PTY host, the documentation server and its viewer moved to
# `worktrees-api` with the handlers that drive them, and took every one of
# their dependencies with them: portable-pty, libc, hyper, hyper-util,
# http-body-util, tokio, sha2 and getrandom. No file under `src/` names one
# any more — checked, not assumed.


[target.'cfg(target_os = "macos")'.dependencies]
# One raw selector at startup: turn Writing Tools off for the webview, so
# macOS's selection affordance can't take the app down. See `run`'s setup.
objc2 = "0.6"
