[package]
name = "app"
version.workspace = true
description = "worktrees — one place per branch (desktop app)"
authors = ["David"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Types the client-local commands still name (`ops::REPO_SLUG`, the release
# list). The ENGINE is not in this process any more: the app is a client of
# this host's `worktrees serve` (src/engine.rs finds or starts it).
worktrees-core = { workspace = true }
# The client-local bodies (editor, terminal, clipboard, release list) and the
# process preamble `host::boot` — the log sink, the panic hook, the GUI PATH
# repair the editor and terminal launches depend on. No `Ctx` is built here.
worktrees-api = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: round-trip unknown keys in the declared store in file order.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The PTY host, the documentation server and its viewer moved to
# `worktrees-api` with the handlers that drive them, and took portable-pty,
# hyper, hyper-util, http-body-util and tokio with them.
#
# Finding or starting `worktrees serve` (src/engine.rs): `libc` for
# `kill(pid, 0)`, SIGTERM and the child's `setsid`; and handshake v1, client
# side — the shim proves a serve holds serve.json's token before it uses or
# replaces it. tungstenite's sync client with only `handshake`, and hmac 0.13
# + sha2 0.11 without defaults: exactly the features worktrees-cli already
# enables, so the lock gains no crate. getrandom for the client nonce.
libc = { workspace = true }
getrandom = "0.3"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }


[target.'cfg(target_os = "macos")'.dependencies]
# One raw selector at startup: turn Writing Tools off for the webview, so
# macOS's selection affordance can't take the app down. See `run`'s setup.
objc2 = "0.6"
