  <path d="M 512 640 C 512 520, 322 576, 322 428" stroke="#f0fdf4" stroke-width="56" stroke-linecap="round" fill="none"/>
  <!-- right branch -->
  <path d="M 512 584 C 512 464, 702 520, 702 372" stroke="#f0fdf4" stroke-width="56" stroke-linecap="round" fill="none"/>
  <!-- leaf nodes (commits) -->
  <circle cx="322" cy="358" r="64" fill="#6ee7b7"/>
  <circle cx="702" cy="302" r="64" fill="#6ee7b7"/>
  <circle cx="512" cy="330" r="88" fill="#34d399"/>
  <circle cx="512" cy="330" r="36" fill="#022c22"/>
  <!-- root node -->
