<text x="20" y="521" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c5f77">One line · 56 / 4096 bytes</text>
<text x="20" y="563" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="15" font-weight="400" fill="#4c4f69">Nothing sends until you tap Send message.</text>
