<text x="36" y="211" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4c4f69">To Claude · Sonnet</text>
<text x="36" y="242" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4c4f69">This message can direct work on Studio Mac.</text>
<text x="20" y="316" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4c4f69">Message</text>
