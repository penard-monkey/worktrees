<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Compare codes</title>
<desc id="desc">Worktrees iOS wireframe, Catppuccin Latte light. Fictional host and session data. System surfaces are schematic.</desc>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#e6e9ef"/>
<text x="28" y="30" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4c4f69">9:41</text>
<rect x="310" y="19" width="4" height="9" rx="1" fill="#4c4f69"/>
<rect x="317" y="16" width="4" height="12" rx="1" fill="#4c4f69"/>
<rect x="324" y="13" width="4" height="15" rx="1" fill="#4c4f69"/>
<rect x="341" y="14" width="25" height="13" rx="3" fill="#e6e9ef" stroke="#4c4f69"/>
<rect x="344" y="17" width="17" height="7" rx="1" fill="#4c4f69"/>
<text x="20" y="77" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#4c4f69">‹ Cancel</text>
<text x="20" y="127" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="28" font-weight="600" fill="#4c4f69">Compare codes</text>
<text x="20" y="155" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c5f77">Pairing with Studio Mac</text>
<rect x="20" y="185" width="350" height="225" rx="10" fill="#eff1f5"/>
<text x="36" y="219" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#4c4f69">Code from this connection</text>
<text x="195" y="290" font-family="ui-monospace, monospace" font-size="40" font-weight="600" fill="#4c4f69" text-anchor="middle">482 193</text>
<text x="36" y="339" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">Check all six digits on Studio Mac.</text>
<text x="36" y="364" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">The host name alone is not proof.</text>
<text x="20" y="456" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#4c4f69">Do the codes match?</text>
<text x="20" y="481" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#4c4f69">If they differ, cancel here and deny</text>
<text x="20" y="506" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#4c4f69">this request on the host.</text>
<rect x="20" y="634" width="350" height="50" rx="10" fill="#1e66f5"/>
<text x="195.0" y="665" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Codes match</text>
<rect x="20" y="696" width="350" height="50" rx="10" fill="#eff1f5" stroke="#4c4f69"/>
<text x="195.0" y="727" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4c4f69" text-anchor="middle">Cancel pairing</text>
<text x="20" y="785" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c5f77">Approve this phone on the host only after checking.</text>
<rect x="127" y="824" width="136" height="5" rx="3" fill="#4c4f69"/>
