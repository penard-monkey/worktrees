<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Pair a host</title>
<desc id="desc">Worktrees iOS wireframe, Catppuccin Latte light. Fictional host and session data. System surfaces are schematic.</desc>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#e6e9ef"/>
<text x="28" y="30" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4c4f69">9:41</text>
<rect x="310" y="19" width="4" height="9" rx="1" fill="#4c4f69"/>
<rect x="317" y="16" width="4" height="12" rx="1" fill="#4c4f69"/>
<rect x="324" y="13" width="4" height="15" rx="1" fill="#4c4f69"/>
<rect x="341" y="14" width="25" height="13" rx="3" fill="#e6e9ef" stroke="#4c4f69"/>
<rect x="344" y="17" width="17" height="7" rx="1" fill="#4c4f69"/>
<text x="20" y="127" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="28" font-weight="600" fill="#4c4f69">Pair a host</text>
<text x="20" y="155" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c5f77">Your projects, wherever you are.</text>
<text x="20" y="198" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">On your host, open Worktrees pairing.</text>
<text x="20" y="223" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">Then scan the QR code shown there.</text>
<rect x="55" y="266" width="280" height="250" rx="10" fill="#e1e5eb" stroke="#4c4f69"/>
<rect x="71" y="282" width="36" height="36" rx="5" fill="#eff1f5" stroke="#4c4f69"/>
<rect x="283" y="282" width="36" height="36" rx="5" fill="#eff1f5" stroke="#4c4f69"/>
<rect x="71" y="464" width="36" height="36" rx="5" fill="#eff1f5" stroke="#4c4f69"/>
<rect x="283" y="464" width="36" height="36" rx="5" fill="#eff1f5" stroke="#4c4f69"/>
<text x="195" y="377" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#4c4f69" text-anchor="middle">Camera opens here</text>
<text x="195" y="405" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c5f77" text-anchor="middle">Point at the host’s QR code</text>
<text x="20" y="552" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">Pair only with a host you trust.</text>
<text x="20" y="577" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4c4f69">You’ll compare a code on both screens.</text>
<rect x="20" y="638" width="350" height="50" rx="10" fill="#1e66f5"/>
<text x="195.0" y="669" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Scan QR code</text>
<rect x="20" y="700" width="350" height="50" rx="10" fill="#eff1f5" stroke="#4c4f69"/>
<text x="195.0" y="731" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4c4f69" text-anchor="middle">Paste pairing link</text>
<text x="20" y="786" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c5f77">Camera access is requested when you scan.</text>
<rect x="127" y="824" width="136" height="5" rx="3" fill="#4c4f69"/>
</svg>
