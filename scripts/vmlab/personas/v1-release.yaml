{
  "_comment": [
    "The release test (v0.52.0, 2026-11-14): v1's rehearsal with THREE people on three screens,",
    "Dana (owner, macOS), Bret (guest, macOS) and Cy (Debian, the AppImage), where Cy is Dana's",
    "second guest AND a host himself (§12.2): his lane is shared with Dana.",
    "Run it with `--persons 3 --from-ui`: the new first run (Share with… -> Someone new -> the link",
    "-> Join with a link… -> the code -> Allow -> Share) is what this release ships, and it is",
    "done in the apps before the run; `first_run` below is what it took, measured by hand on the",
    "three VMs, and the run's record carries it. The run adopts the pairings and shares it left.",
    "An intent's `on` names the share it acts on: `dana` (default) or `cy`.",
    "YAML written in its JSON subset, so the driver reads it with the stdlib."
  ],
  "variant": "v1-release",
  "task": "json-flag-plan",
  "people": {
    "dana": {"role": "owner", "about": "Owns the lane and its agent. Terse, decides what the agent gets."},
    "bret": {"role": "guest", "about": "A reviewer who reads the live session and comments in the thread. Precise about CLI behaviour."},
    "cy":   {"role": "guest", "about": "A second engineer on Linux who owns the code that prints status; he also shares his own lane."}
  },
  "first_run": {
    "_comment": "Acts counted by hand on the VMs (a click, a field filled, a paste, a key), 2026-11-14, release v0.52.0.",
    "dana_shares_with_bret": {"owner_acts": 7, "guest_acts": 6,
      "steps": ["lane: Share with…", "Someone new: type Bret", "Invite them", "B1 detour: 'A guest named Bret exists' -> Pair another device for Bret",
                "Copy (the link sent out of band)", "Allow (codes equal)", "Share with Bret",
                "guest: Home", "Join with a link…", "paste", "device name", "Join", "read the code to Dana"]},
    "dana_adds_cy": {"owner_acts": 6, "guest_acts": 6, "ui_path": false,
      "steps": ["Settings -> Guests -> Invite a guest (B4: Sharing… cannot add anyone)", "type Cy", "Show the pairing code", "Copy", "Allow",
                "Cy: Join with a link…, paste, device name, Join", "Cy: Ask on gc-lane -> toast 'Sharing… on its lane adds a guest' with only Dismiss (B4)",
                "stand-in: share_allow from the CLI"]},
    "cy_shares_with_dana": {"owner_acts": 6, "guest_acts": 6,
      "steps": ["Cy's lane: Share with…", "Someone new: type Dana", "Invite them", "Turn on and show the link (remote access inline)",
                "Copy", "Allow (codes equal)", "Share with Dana", "Dana: Home, Join with a link…, paste, device name, Join"]}
  },
  "watch_files": ["docs/notes/group-chat-test.md"],
  "intents": [
    {"who": "bret", "act": "open_share", "wait_s": 3},
    {"who": "dana", "act": "allow", "args": {"guest": "bret"}, "wait_s": 2},
    {"who": "dana", "act": "open_thread", "wait_s": 1},
    {"who": "cy", "act": "open_share", "wait_s": 2, "why": "Cy was let in by share_allow (B4), so this proves he reads it"},

    {"who": "dana", "act": "send_task",
     "args": {"text": "Create docs/notes/group-chat-test.md with a five-line plan for adding a --json flag to the worktrees status command. Do not run git. Keep it short."}},
    {"who": "dana", "act": "wait", "args": {"until": "agent_idle", "max_s": 180}},

    {"who": "bret", "act": "post", "wait_s": 5,
     "args": {"text": {"generate": "Ask, in one sentence, what exit code the plan gives when the place does not exist.",
                       "fallback": "The plan should say what the exit code is when the place does not exist."}}},
    {"who": "bret", "act": "post", "wait_s": 3, "why": "#669's smart-dash fix: two hyphens must survive the composer",
     "args": {"text": "Use --json and --no-color here"}},
    {"who": "cy", "act": "post", "wait_s": 3, "why": "a post from the Linux app",
     "args": {"text": {"generate": "As a second engineer who owns the code that prints status, say in one sentence which field you would want in the JSON.",
                       "fallback": "From the status side: please include the branch and the session state as fields."}}},
    {"who": "dana", "act": "use_these", "args": {"note": ""}, "why": "Use these takes posts from both guests"},
    {"who": "dana", "act": "wait", "args": {"until": "agent_idle", "max_s": 180}},

    {"who": "bret", "act": "read_diff", "impossible": "V1 shows that a command ran, not the file it wrote (§1)"},

    {"who": "bret", "act": "post", "wait_s": 3,
     "args": {"text": {"generate": "Having read the latest turn, ask in one sentence for the plan to name one test to add.",
                       "fallback": "Nice. Could the plan name one test to add?"}}},
    {"who": "cy", "act": "post", "wait_s": 3,
     "args": {"text": {"generate": "Agree in one sentence with the last comment and add one edge case the test should cover.",
                       "fallback": "Agreed, and the test should cover a place whose session is closed."}}},
    {"who": "dana", "act": "use_these", "args": {"note": "Fold these into the plan file, then show me the file."}},
    {"who": "dana", "act": "wait", "args": {"until": "agent_idle", "max_s": 180}},

    {"who": "dana", "on": "cy", "act": "open_share", "wait_s": 3, "why": "Dana, a guest of Cy's host"},
    {"who": "cy", "on": "cy", "act": "open_lane", "wait_s": 1, "why": "Cy was reading Dana's share; his own lane's bar has the Allow"},
    {"who": "cy", "on": "cy", "act": "allow", "args": {"guest": "dana"}, "wait_s": 2},
    {"who": "cy", "on": "cy", "act": "open_thread", "wait_s": 1},
    {"who": "cy", "on": "cy", "act": "send_task",
     "args": {"text": "In one short paragraph, say which function prints the status line in crates/worktrees-cli (name the file). Do not edit anything."}},
    {"who": "cy", "on": "cy", "act": "wait", "args": {"until": "agent_idle", "max_s": 180}},
    {"who": "dana", "on": "cy", "act": "post", "wait_s": 3,
     "args": {"text": {"generate": "As the owner of the --json plan, ask Cy's agent in one sentence whether that function already has a machine-readable mode.",
                       "fallback": "Does that function already have a machine-readable mode we could reuse for --json?"}}},
    {"who": "cy", "on": "cy", "act": "use_these", "args": {"note": "Answer Dana's question in two sentences."}},
    {"who": "cy", "on": "cy", "act": "wait", "args": {"until": "agent_idle", "max_s": 180}},

    {"who": "dana", "act": "open_lane", "wait_s": 1},
    {"who": "bret", "act": "ask_share", "args": {"slug": "(main)", "note": "Can I see main too, to compare the status command there?"}, "wait_s": 3},
    {"who": "dana", "act": "wait", "args": {"s": 20}},
    {"who": "dana", "act": "answer_request", "wait_s": 2},

    {"who": "dana", "act": "end_session"},
    {"who": "dana", "act": "share_again", "wait_s": 5},
    {"who": "dana", "act": "reboot_owner"},
    {"who": "bret", "act": "post", "wait_s": 3,
     "args": {"text": {"generate": "The host just came back from a restart. Ask in one sentence whether the plan file survived and is complete.",
                       "fallback": "Back after the restart: is the plan file still complete?"}}},
    {"who": "cy", "act": "open_share", "wait_s": 2, "why": "Cy was on his own lane; Dana's thread is in her share's view"},
    {"who": "cy", "act": "post", "wait_s": 3,
     "args": {"text": "Same question from me: did the JSON fields survive the restart?"}},
    {"who": "dana", "act": "send_task", "args": {"text": "Reply with one line: BACK."},
     "why": "after the reboot Use these refuses until the resumed agent names its session (#670): Dana says something first"},
    {"who": "dana", "act": "share_again", "wait_s": 3,
     "why": "the rebooted lane's Codex is a NEW session: the line Dana sent ended the binding; Share again binds it"},
    {"who": "dana", "act": "use_these", "args": {"note": "Check the plan file is complete and tell me."}},
    {"who": "dana", "act": "wait", "args": {"until": "agent_idle", "max_s": 120}},
    {"who": "dana", "act": "stop_sharing", "wait_s": 5},
    {"who": "cy", "on": "cy", "act": "stop_sharing", "wait_s": 5}
  ]
}
