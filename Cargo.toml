# Virtual workspace: the Rust CLI core + binary, and the Tauri app, share one
# target/ and Cargo.lock. See MIGRATION.md. The Rust binary (crates/worktrees-cli)
# is the shipped CLI; the legacy bash engine lives at bin/worktrees.bash as a
# parallel test gate until the migration retires it.
[workspace]
resolver = "2"
members = ["crates/worktrees-core", "crates/worktrees-cli", "app/src-tauri"]

[workspace.package]
version = "0.19.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Parse-only: `worktrees init` hand-templates its output (the file's value is its
# explanatory comments), so the serializer is deliberately left out.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# `kill(pid, 0)` for the slot lock's PID-liveness check (proposal §6 /
# DESIGN.md:205). std has no process-existence probe, and the alternatives are a
# wall-clock heuristic (which false-positives across a laptop sleep) or shelling
# out to `kill` (a new binary dependency the no-tmux PATH whitelist would break).
libc = "0.2"
clap = { version = "4", features = ["derive"] }
worktrees-core = { path = "crates/worktrees-core" }
